<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        /* div{
            background-color: red;
        } */

        /* Class Selectors */
        .blue{
            background-color: blue;
        }
        
        /* Id Selectors */
        #green{
            background-color: green;
        }

        /* Child Selectors */
        div > p {
            color: yellow;
            background-color: brown;
        }


        /* Descendant Selector */
        div  p {
            color: purple;
            background-color: pink;
        }

        /* Universal Selector */
        * {
            margin:0;
            padding:0;
        }

        /* Pseudo Selector */
        a:active{
            color: green;
        }

    </style>
</head>
<body>
    <div>I am div
        
    </div>

    <div>
    <p>I am a direct child.</p>
    <section>
        <p>I am a grandchild.</p>
    </section>
    </div>

    <div class="blue">i am newone</div>
    <div id="green">i am newdiv</div>
    <div>
        <a href="https://www.google.com">Google me</a>
    </div>
</body>
</html>
